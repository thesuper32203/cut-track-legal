<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cut Track — Legal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    p.sub { color: #888; margin-bottom: 48px; font-size: 0.95rem; }
    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    a.card {
      display: block;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 32px 40px;
      text-decoration: none;
      color: #f0f0f0;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s;
      min-width: 200px;
    }
    a.card:hover {
      border-color: #555;
      transform: translateY(-2px);
    }
    a.card .icon { font-size: 2rem; margin-bottom: 12px; }
    a.card .label { font-size: 1rem; font-weight: 600; }
    footer {
      margin-top: 60px;
      color: #444;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <h1>Cut Track</h1>
  <p class="sub">Legal Documents</p>
  <div class="cards">
    <a class="card" href="privacy.html">
      <div class="icon">🔒</div>
      <div class="label">Privacy Policy</div>
    </a>
    <a class="card" href="terms.html">
      <div class="icon">📄</div>
      <div class="label">Terms of Service</div>
    </a>
  </div>
  <footer>Questions? <a href="mailto:cuttrackofficial@gmail.com" style="color:#666;">cuttrackofficial@gmail.com</a></footer>
</body>
</html>
